<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily GK Test | MKJ GEO</title>
<style>
body{font-family:Arial,sans-serif;background:#eef4ff;margin:0;padding:12px;color:#222}
header{background:#083b75;color:white;text-align:center;padding:20px 10px;border-radius:12px}
.container{max-width:750px;margin:20px auto}
.question{background:white;padding:15px;margin:15px 0;border-radius:10px;box-shadow:0 2px 7px #0001}
.question p{font-weight:bold;line-height:1.6}
label{display:block;padding:11px;margin:7px 0;background:#f0f4fa;border-radius:7px;cursor:pointer}
button{width:100%;padding:14px;background:#087b45;color:white;border:0;border-radius:8px;font-size:18px;cursor:pointer}
#result{display:none;background:white;padding:20px;margin-top:20px;border-radius:10px;text-align:center}
.answer{line-height:1.6}
footer{text-align:center;padding:20px}
</style>
</head>
<body>

<header>
<h1>🌍 MKJ GEO</h1>
<h2>Daily GK Online Test</h2>
<p>दैनिक सामान्य ज्ञान परीक्षा | Daily General Knowledge Quiz</p>
<p>कक्षा 6 से 12 | Classes 6 to 12</p>
</header>

<div class="container">
<h2>📝 आज के 20 प्रश्न | Today's 20 Questions</h2>
<p>सही विकल्प चुनें। Choose the correct option.</p>
<form id="quiz"></form>
<button type="button" id="submitBtn" onclick="submitQuiz()">टेस्ट सबमिट करें | Submit Test</button>
<div id="result"></div>
</div>

<footer>MKJ GEO — ज्ञान बढ़ाएँ, आगे बढ़ें!<br>Learn Every Day, Grow Every Day!</footer>

<script>
const questions = [
{q:"भारत का संविधान कब लागू हुआ? / When did the Constitution of India come into effect?",o:["15 अगस्त 1947 / 15 August 1947","26 जनवरी 1950 / 26 January 1950","26 नवंबर 1949 / 26 November 1949","2 अक्टूबर 1950 / 2 October 1950"],a:1},
{q:"भारत की राजधानी क्या है? / What is the capital of India?",o:["मुंबई / Mumbai","जयपुर / Jaipur","नई दिल्ली / New Delhi","कोलकाता / Kolkata"],a:2},
{q:"भारत का राष्ट्रीय पशु कौन है? / What is the national animal of India?",o:["शेर / Lion","बाघ / Tiger","हाथी / Elephant","तेंदुआ / Leopard"],a:1},
{q:"भारत का राष्ट्रीय गान किसने लिखा? / Who wrote India's national anthem?",o:["महात्मा गांधी / Mahatma Gandhi","रवीन्द्रनाथ टैगोर / Rabindranath Tagore","प्रेमचंद / Premchand","सुभाष चंद्र बोस / Subhas Chandra Bose"],a:1},
{q:"भारत के प्रथम राष्ट्रपति कौन थे? / Who was the first President of India?",o:["डॉ. राजेंद्र प्रसाद / Dr. Rajendra Prasad","डॉ. राधाकृष्णन / Dr. Radhakrishnan","जवाहरलाल नेहरू / Jawaharlal Nehru","डॉ. ए.पी.जे. अब्दुल कलाम / Dr. A.P.J. Abdul Kalam"],a:0},
{q:"भारत का राष्ट्रीय पक्षी कौन है? / What is the national bird of India?",o:["तोता / Parrot","मोर / Peacock","कबूतर / Pigeon","हंस / Swan"],a:1},
{q:"भारत में स्वतंत्रता दिवस कब मनाया जाता है? / When is Independence Day celebrated in India?",o:["26 जनवरी / 26 January","15 अगस्त / 15 August","2 अक्टूबर / 2 October","14 नवंबर / 14 November"],a:1},
{q:"भारत की मुद्रा क्या है? / What is the currency of India?",o:["डॉलर / Dollar","येन / Yen","रुपया / Rupee","यूरो / Euro"],a:2},
{q:"भारत का राष्ट्रीय फूल कौन-सा है? / What is the national flower of India?",o:["गुलाब / Rose","कमल / Lotus","चमेली / Jasmine","सूरजमुखी / Sunflower"],a:1},
{q:"भारत के राष्ट्रपिता के रूप में किसे जाना जाता है? / Who is popularly known as the Father of the Nation in India?",o:["महात्मा गांधी / Mahatma Gandhi","भगत सिंह / Bhagat Singh","सरदार पटेल / Sardar Patel","बाल गंगाधर तिलक / Bal Gangadhar Tilak"],a:0},
{q:"राजस्थान की राजधानी कौन-सी है? / What is the capital of Rajasthan?",o:["जोधपुर / Jodhpur","उदयपुर / Udaipur","जयपुर / Jaipur","अजमेर / Ajmer"],a:2},
{q:"राजस्थान दिवस कब मनाया जाता है? / When is Rajasthan Day celebrated?",o:["30 मार्च / 30 March","1 नवंबर / 1 November","15 अगस्त / 15 August","26 जनवरी / 26 January"],a:0},
{q:"राजस्थान का राज्य वृक्ष कौन-सा है? / What is the state tree of Rajasthan?",o:["नीम / Neem","खेजड़ी / Khejri","पीपल / Peepal","बरगद / Banyan"],a:1},
{q:"राजस्थान का प्रसिद्ध मरुस्थल कौन-सा है? / Which famous desert is located in Rajasthan?",o:["सहारा / Sahara","गोबी / Gobi","थार / Thar","कालाहारी / Kalahari"],a:2},
{q:"राजस्थान का सर्वोच्च पर्वत शिखर कौन-सा है? / What is the highest mountain peak in Rajasthan?",o:["गुरु शिखर / Guru Shikhar","सेर / Ser","तारागढ़ / Taragarh","अचलगढ़ / Achalgarh"],a:0},
{q:"पानी का रासायनिक सूत्र क्या है? / What is the chemical formula of water?",o:["CO₂","O₂","H₂O","NaCl"],a:2},
{q:"सौरमंडल का सबसे बड़ा ग्रह कौन-सा है? / Which is the largest planet in the Solar System?",o:["पृथ्वी / Earth","बृहस्पति / Jupiter","शनि / Saturn","मंगल / Mars"],a:1},
{q:"सूर्य के सबसे निकट ग्रह कौन-सा है? / Which planet is closest to the Sun?",o:["शुक्र / Venus","पृथ्वी / Earth","बुध / Mercury","मंगल / Mars"],a:2},
{q:"प्रकाश संश्लेषण के लिए पौधे कौन-सी गैस लेते हैं? / Which gas do plants absorb for photosynthesis?",o:["ऑक्सीजन / Oxygen","नाइट्रोजन / Nitrogen","कार्बन डाइऑक्साइड / Carbon dioxide","हाइड्रोजन / Hydrogen"],a:2},
{q:"विश्व पर्यावरण दिवस कब मनाया जाता है? / When is World Environment Day observed?",o:["5 जून / 5 June","22 अप्रैल / 22 April","16 सितंबर / 16 September","10 दिसंबर / 10 December"],a:0}
];

const quiz=document.getElementById("quiz");

questions.forEach((item,i)=>{
 const box=document.createElement("div");
 box.className="question";
 box.id="q"+i;
 let html="<p>"+(i+1)+". "+item.q+"</p>";
 item.o.forEach((option,j)=>{
  html+='<label><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+". "+option+'</label>';
 });
 box.innerHTML=html;
 quiz.appendChild(box);
});

function submitQuiz(){
 let score=0,attempted=0;
 questions.forEach((item,i)=>{
  const selected=document.querySelector('input[name="q'+i+'"]:checked');
  const box=document.getElementById("q"+i);
  box.querySelectorAll(".answer").forEach(el=>el.remove());
  if(selected){attempted++;if(Number(selected.value)===item.a)score++;}
  const answer=document.createElement("p");
  answer.className="answer";
  if(selected && Number(selected.value)===item.a){
   answer.style.color="green";
   answer.textContent="✅ सही उत्तर / Correct!";
  }else{
   answer.style.color="#c62828";
   answer.textContent="❌ सही उत्तर / Correct Answer: "+item.o[item.a];
  }
  box.appendChild(answer);
  box.querySelectorAll("input").forEach(input=>input.disabled=true);
 });
 const result=document.getElementById("result");
 result.style.display="block";
 result.innerHTML="<h2>आपका परिणाम / Your Result</h2><h1>"+score+" / 20</h1><p>सही उत्तर / Correct: "+score+"</p><p>गलत या छोड़े गए प्रश्न / Wrong or Unanswered: "+(20-score)+"</p><p>हल किए / Attempted: "+attempted+"</p><h3>"+(score>=16?"बहुत बढ़िया! / Excellent! 🌟":score>=10?"अच्छा प्रयास! / Good Effort! 👏":"अभ्यास जारी रखें! / Keep Practising! 💪")+"</h3><button onclick='location.reload()'>फिर से टेस्ट दें / Try Again</button>";
 document.getElementById("submitBtn").disabled=true;
 result.scrollIntoView({behavior:"smooth"});
}
</script>
</body>
</html>￼Enter
