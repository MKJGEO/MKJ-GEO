const today = new Date();
const start = new Date(today.getFullYear(),0,0);
const dayOfYear = Math.floor((today-start)/86400000);
const totalDays = Math.ceil(bank.length/20);
const group = dayOfYear % totalDays;
const dailyQuestions = bank.slice(group*20,group*20+20);

const quiz = document.getElementById("quiz");

dailyQuestions.forEach((item,i)=>{
  const box=document.createElement("div");
  box.className="question";
  box.id="q"+i;
  let html="<p>"+(i+1)+". "+item.q+"</p>";
  item.o.forEach((option,j)=>{
    html+='<label><input type="radio" name="q'+i+'" value="'+j+'"> '+option+'</label>';
  });
  box.innerHTML=html;
  quiz.appendChild(box);
});

function submitQuiz(){
  let score=0, attempted=0;
  dailyQuestions.forEach((item,i)=>{
    const selected=document.querySelector('input[name="q'+i+'"]:checked');
    const box=document.getElementById("q"+i);
    box.querySelectorAll(".answer").forEach(e=>e.remove());
    if(selected){
      attempted++;
      if(Number(selected.value)===item.a)score++;
    }
    const answer=document.createElement("p");
    answer.className="answer";
    if(selected && Number(selected.value)===item.a){
      answer.style.color="green";
      answer.textContent="✅ सही उत्तर / Correct!";
    }else{
      answer.style.color="#c62828";
      answer.textContent="❌ सही उत्तर / Correct Answer: "+item.o[item.a];
    }
    box.appendChild(answer);
    box.querySelectorAll("input").forEach(input=>input.disabled=true);
  });
  const result=document.getElementById("result");
  result.style.display="block";
  result.innerHTML="<h2>आपका परिणाम / Your Result</h2><h1>"+score+" / 20</h1><p>प्रयास किए / Attempted: "+attempted+" / 20</p>";
  document.getElementById("submitBtn").disabled=true;
  result.scrollIntoView({behavior:"smooth"});
}
</script>
